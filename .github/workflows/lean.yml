name: Lean verification

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          nanoda: true
          nanoda-allow-sorry: false
      - name: Audit placeholders and theorem axioms
        run: bash scripts/audit.sh
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.8"
          working-directory: validation
          enable-cache: true
          cache-python: true
      - name: Audit exact-metric validation artifacts
        working-directory: validation
        run: ./audit.sh
