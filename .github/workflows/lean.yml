name: Lean verification

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          nanoda: true
          nanoda-allow-sorry: false
      - name: Audit placeholders and theorem axioms
        run: bash scripts/audit.sh

